<!DOCTYPE html>
<!--
  Moodist Cast Web Receiver — Standalone Audio Player
  ====================================================
  Runs on the Chromecast. Plays Moodist audio directly via Howler.js.
  Receives state (selected sounds + volumes) from the Android sender app
  via the Cast custom message channel and applies it in real time.

  No iframe — avoids all cross-origin restrictions.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Moodist</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 30% 40%, rgba(74,222,128,0.07) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 70%, rgba(59,130,246,0.05) 0%, transparent 55%);
      pointer-events: none;
    }
    #header {
      position: fixed;
      top: 48px; left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    #logo { width: 52px; height: 52px; opacity: 0.9; }
    #app-title {
      font-size: 26px; font-weight: 600;
      letter-spacing: 0.08em; color: #fafafa; opacity: 0.9;
    }
    #sounds-container {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: flex; flex-wrap: wrap;
      justify-content: center; gap: 12px;
      max-width: 80vw;
    }
    .sound-pill {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 8px 20px;
      font-size: 15px; color: #d1fae5;
      display: flex; align-items: center; gap: 8px;
      animation: fadeIn 0.4s ease;
    }
    .sound-pill .vol { font-size: 12px; opacity: 0.5; color: #fff; }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to   { opacity: 1; transform: scale(1); }
    }
    #status {
      position: fixed;
      bottom: 32px; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-size: 14px; color: rgba(255,255,255,0.4); letter-spacing: 0.04em;
    }
    #status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #4ade80; animation: pulse 2s infinite;
    }
    #status-dot.idle { background: rgba(255,255,255,0.2); animation: none; }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.5; transform:scale(.85); }
    }
    #idle-msg {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      text-align: center; opacity: 0.3;
    }
    #idle-msg h2 { font-size: 22px; font-weight: 400; margin-bottom: 8px; }
    #idle-msg p  { font-size: 15px; }
  </style>
</head>
<body>

<div id="header">
  <svg id="logo" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path fill-rule="evenodd" clip-rule="evenodd" fill="#FFFFFF"
      d="M28.2607 52.3293C22.5798 59.0451 22.5798 68.9548 28.2607 75.6706C28.5737 76.0407 28.904 76.4011 29.2516 76.7507C29.6492 77.1507 30.0608 77.5279 30.4848 77.8825C30.4357 78.433 30.4114 78.9908 30.4131 79.5547C30.4145 80.0477 30.4358 80.5361 30.4761 81.0191C31.2079 89.7849 38.2151 96.7921 46.9809 97.5239C47.4639 97.5642 47.9523 97.5855 48.4453 97.587C49.0092 97.5886 49.567 97.5643 50.1176 97.5152C50.4721 97.9392 50.8494 98.3508 51.2493 98.7484C51.5989 99.096 51.9593 99.4263 52.3294 99.7393C59.0452 105.42 68.9549 105.42 75.6707 99.7393C76.0407 99.4262 76.4011 99.0959 76.7507 98.7484C77.1507 98.3508 77.5279 97.9392 77.8825 97.5152C78.433 97.5643 78.9908 97.5886 79.5547 97.5869C80.0477 97.5855 80.5361 97.5642 81.0192 97.5239C89.7849 96.7921 96.7922 89.7849 97.5239 81.0191C97.5643 80.536 97.5855 80.0476 97.587 79.5547C97.5887 78.9908 97.5644 78.433 97.5152 77.8824C97.9393 77.5279 98.3508 77.1506 98.7484 76.7507C99.096 76.4011 99.4263 76.0407 99.7394 75.6706C105.42 68.9548 105.42 59.0451 99.7393 52.3294C99.4263 51.9593 99.096 51.5989 98.7484 51.2493C98.3508 50.8493 97.9392 50.4721 97.5152 50.1176C97.5643 49.567 97.5886 49.0092 97.587 48.4453C97.5855 47.9523 97.5642 47.4639 97.5239 46.9809C96.7921 38.2151 89.7849 31.2079 81.0191 30.4761C80.5361 30.4358 80.0477 30.4145 79.5547 30.413C78.9908 30.4114 78.433 30.4357 77.8825 30.4848C77.5279 30.0608 77.1507 29.6492 76.7507 29.2516C76.4011 28.904 76.0407 28.5737 75.6706 28.2607C68.9549 22.5798 59.0452 22.5798 52.3294 28.2606C51.9593 28.5737 51.5989 28.904 51.2493 29.2516C50.8494 29.6492 50.4721 30.0608 50.1176 30.4848C49.567 30.4356 49.0093 30.4114 48.4453 30.413C47.9524 30.4145 47.464 30.4357 46.9809 30.4761C38.2151 31.2079 31.2079 38.2151 30.4761 46.9808C30.4358 47.4639 30.4145 47.9523 30.4131 48.4453C30.4114 49.0092 30.4357 49.567 30.4848 50.1175C30.0608 50.4721 29.6492 50.8493 29.2516 51.2493C28.9041 51.5989 28.5738 51.9592 28.2607 52.3293Z"/>
  </svg>
  <div id="app-title">moodist</div>
</div>

<div id="idle-msg">
  <h2>Ready to cast</h2>
  <p>Select sounds in the Moodist app on your phone</p>
</div>

<div id="sounds-container"></div>

<div id="status">
  <div id="status-dot" class="idle"></div>
  <span id="status-text">Waiting for connection…</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script>
  // ── Sound catalogue ────────────────────────────────────────────────────────
  // Audio files are hosted alongside this receiver page on GitHub Pages.
  // Path is relative so no CORS issues and no dependency on moodist.mvze.net.
  const B = './sounds';
  const URLS = {
    'river':B+'/nature/river.mp3','waves':B+'/nature/waves.mp3',
    'campfire':B+'/nature/campfire.mp3','wind':B+'/nature/wind.mp3',
    'howling-wind':B+'/nature/howling-wind.mp3',
    'wind-in-trees':B+'/nature/wind-in-trees.mp3',
    'waterfall':B+'/nature/waterfall.mp3',
    'walk-in-snow':B+'/nature/walk-in-snow.mp3',
    'walk-on-leaves':B+'/nature/walk-on-leaves.mp3',
    'walk-on-gravel':B+'/nature/walk-on-gravel.mp3',
    'droplets':B+'/nature/droplets.mp3','jungle':B+'/nature/jungle.mp3',
    'light-rain':B+'/rain/light-rain.mp3',
    'heavy-rain':B+'/rain/heavy-rain.mp3',
    'thunder':B+'/rain/thunder.mp3',
    'rain-on-window':B+'/rain/rain-on-window.mp3',
    'rain-on-car-roof':B+'/rain/rain-on-car-roof.mp3',
    'rain-on-umbrella':B+'/rain/rain-on-umbrella.mp3',
    'rain-on-tent':B+'/rain/rain-on-tent.mp3',
    'rain-on-leaves':B+'/rain/rain-on-leaves.mp3',
    'birds':B+'/animals/birds.mp3','seagulls':B+'/animals/seagulls.mp3',
    'crickets':B+'/animals/crickets.mp3','wolf':B+'/animals/wolf.mp3',
    'owl':B+'/animals/owl.mp3','frog':B+'/animals/frog.mp3',
    'dog-barking':B+'/animals/dog-barking.mp3',
    'horse-gallop':B+'/animals/horse-gallop.mp3',
    'cat-purring':B+'/animals/cat-purring.mp3',
    'crows':B+'/animals/crows.mp3','whale':B+'/animals/whale.mp3',
    'beehive':B+'/animals/beehive.mp3',
    'woodpecker':B+'/animals/woodpecker.mp3',
    'chickens':B+'/animals/chickens.mp3','cows':B+'/animals/cows.mp3',
    'sheep':B+'/animals/sheep.mp3',
    'highway':B+'/urban/highway.mp3','road':B+'/urban/road.mp3',
    'ambulance-siren':B+'/urban/ambulance-siren.mp3',
    'busy-street':B+'/urban/busy-street.mp3',
    'crowd':B+'/urban/crowd.mp3','traffic':B+'/urban/traffic.mp3',
    'fireworks':B+'/urban/fireworks.mp3',
    'cafe':B+'/places/cafe.mp3','airport':B+'/places/airport.mp3',
    'church':B+'/places/church.mp3','temple':B+'/places/temple.mp3',
    'construction-site':B+'/places/construction-site.mp3',
    'underwater':B+'/places/underwater.mp3',
    'crowded-bar':B+'/places/crowded-bar.mp3',
    'night-village':B+'/places/night-village.mp3',
    'subway-station':B+'/places/subway-station.mp3',
    'office':B+'/places/office.mp3',
    'supermarket':B+'/places/supermarket.mp3',
    'carousel':B+'/places/carousel.mp3',
    'laboratory':B+'/places/laboratory.mp3',
    'laundry-room':B+'/places/laundry-room.mp3',
    'restaurant':B+'/places/restaurant.mp3',
    'library':B+'/places/library.mp3',
    'train':B+'/transport/train.mp3',
    'inside-a-train':B+'/transport/inside-a-train.mp3',
    'airplane':B+'/transport/airplane.mp3',
    'submarine':B+'/transport/submarine.mp3',
    'sailboat':B+'/transport/sailboat.mp3',
    'rowing-boat':B+'/transport/rowing-boat.mp3',
    'keyboard':B+'/things/keyboard.mp3',
    'typewriter':B+'/things/typewriter.mp3',
    'paper':B+'/things/paper.mp3','clock':B+'/things/clock.mp3',
    'wind-chimes':B+'/things/wind-chimes.mp3',
    'singing-bowl':B+'/things/singing-bowl.mp3',
    'ceiling-fan':B+'/things/ceiling-fan.mp3',
    'dryer':B+'/things/dryer.mp3',
    'slide-projector':B+'/things/slide-projector.mp3',
    'boiling-water':B+'/things/boiling-water.mp3',
    'bubbles':B+'/things/bubbles.mp3',
    'tuning-radio':B+'/things/tuning-radio.mp3',
    'morse-code':B+'/things/morse-code.mp3',
    'washing-machine':B+'/things/washing-machine.mp3',
    'vinyl-effect':B+'/things/vinyl-effect.mp3',
    'windshield-wipers':B+'/things/windshield-wipers.mp3',
    'white-noise':B+'/noise/white-noise.wav',
    'pink-noise':B+'/noise/pink-noise.wav',
    'brown-noise':B+'/noise/brown-noise.wav',
    'binaural-delta':B+'/binaural/binaural-delta.wav',
    'binaural-theta':B+'/binaural/binaural-theta.wav',
    'binaural-alpha':B+'/binaural/binaural-alpha.wav',
    'binaural-beta':B+'/binaural/binaural-beta.wav',
    'binaural-gamma':B+'/binaural/binaural-gamma.wav',
  };

  // ── Audio engine ───────────────────────────────────────────────────────────
  const howls = {};
  var globalVol = 1;
  var masterPlaying = false;

  function getHowl(id) {
    if (howls[id]) return howls[id];
    if (!URLS[id]) return null;
    howls[id] = new Howl({ src: [URLS[id]], loop: true, volume: 0, html5: true });
    return howls[id];
  }

  function applyState(state) {
    if (!state) return;
    if (typeof state.globalVolume === 'number') globalVol = state.globalVolume;
    masterPlaying = state.isPlaying !== false;
    const sounds = state.sounds || {};

    // Stop deselected sounds
    Object.keys(howls).forEach(id => {
      if (!sounds[id] || !sounds[id].selected) {
        const h = howls[id];
        if (h.playing()) { h.fade(h.volume(), 0, 500); setTimeout(() => h.stop(), 550); }
      }
    });

    // Start / adjust selected sounds
    const selected = Object.keys(sounds).filter(id => sounds[id] && sounds[id].selected);
    selected.forEach(id => {
      const targetVol = ((sounds[id].volume ?? 1) * globalVol);
      const h = getHowl(id);
      if (!h) return;
      if (masterPlaying) {
        if (!h.playing()) { h.volume(0); h.play(); h.fade(0, targetVol, 800); }
        else { h.fade(h.volume(), targetVol, 300); }
      } else {
        if (h.playing()) { h.fade(h.volume(), 0, 400); setTimeout(() => h.pause(), 450); }
      }
    });

    updateUI(selected, sounds);
  }

  function stopAll() {
    Object.values(howls).forEach(h => {
      if (h.playing()) { h.fade(h.volume(), 0, 400); setTimeout(() => h.stop(), 450); }
    });
    updateUI([], {});
  }

  // ── UI ─────────────────────────────────────────────────────────────────────
  const $container = document.getElementById('sounds-container');
  const $idle      = document.getElementById('idle-msg');
  const $dot       = document.getElementById('status-dot');
  const $statusTxt = document.getElementById('status-text');

  function label(id) {
    return id.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  function updateUI(selected, sounds) {
    $container.innerHTML = '';
    if (selected.length === 0) {
      $idle.style.display = '';
      $dot.classList.add('idle');
      $statusTxt.textContent = masterPlaying ? 'Connected — select sounds on your phone' : 'Paused';
      return;
    }
    $idle.style.display = 'none';
    $dot.classList.remove('idle');
    $statusTxt.textContent = masterPlaying ? 'Playing on Chromecast' : 'Paused';
    selected.forEach(id => {
      const pill = document.createElement('div');
      pill.className = 'sound-pill';
      const pct = Math.round((sounds[id].volume ?? 1) * 100);
      pill.innerHTML = label(id) + ' <span class="vol">' + pct + '%</span>';
      $container.appendChild(pill);
    });
  }

  // ── Cast Receiver SDK ──────────────────────────────────────────────────────
  const NAMESPACE = 'urn:x-cast:com.moodist.state';
  const ctx  = cast.framework.CastReceiverContext.getInstance();
  const opts = new cast.framework.CastReceiverOptions();
  opts.disableIdleTimeout = true;

  ctx.addCustomMessageListener(NAMESPACE, event => {
    try {
      const d = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
      if (d.command === 'play') {
        masterPlaying = true;
        Object.values(howls).forEach(h => { if (!h.playing()) h.play(); });
        $statusTxt.textContent = 'Playing on Chromecast';
        $dot.classList.remove('idle');
      } else if (d.command === 'pause') {
        masterPlaying = false;
        Object.values(howls).forEach(h => {
          if (h.playing()) { h.fade(h.volume(), 0, 400); setTimeout(() => h.pause(), 450); }
        });
        $statusTxt.textContent = 'Paused';
      } else {
        applyState(d);
      }
    } catch(e) { console.error('Cast message error:', e); }
  });

  ctx.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, () => {
    $statusTxt.textContent = 'Connected';
    $dot.classList.remove('idle');
  });

  ctx.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, () => {
    stopAll();
    $dot.classList.add('idle');
    $statusTxt.textContent = 'Waiting for connection…';
  });

  ctx.start(opts);
</script>
</body>
</html>
